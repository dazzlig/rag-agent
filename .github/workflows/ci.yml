name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Poetry
        run: python -m pip install "poetry==1.8.5"

      - name: Validate dependency lock
        run: poetry check --lock

      - name: Install project dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run unit and integration tests
        env:
          PYTHONPATH: src
        run: poetry run python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: poetry run python -m compileall -q src scripts tests

      - name: Check browser JavaScript syntax
        run: node --check src/steam_rag/ui/web/app.js
